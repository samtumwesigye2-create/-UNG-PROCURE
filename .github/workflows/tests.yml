name: tests

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q
      - run: PYTHONPATH=. python -m py_compile app.py demand_intelligence.py supplier_profiles.py purchasing_documents.py procure_matching.py production_planning.py
